# One-command EC2 deployment for Troy Advanced (headless ASCII/CDP AI browser).
#
# Quick start on any Linux EC2 instance (x86_64 or Graviton ARM64):
#   docker compose up -d
#   docker compose ps
#   curl -s http://127.0.0.1:${TROY_AGENT_PORT:-9333}/readyz
#
# Access securely from your laptop via SSH loopback tunnel:
#   troy-advanced ec2 tunnel ec2-user@<ec2-host> --remote-port 9333 --connect

services:
  troy-advanced:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TROY_IMAGE:-troy-advanced:latest}
    container_name: ${TROY_CONTAINER_NAME:-troy-advanced}
    restart: unless-stopped
    init: true
    # Chromium requires adequate /dev/shm to avoid renderer OOM crashes on EC2.
    shm_size: ${TROY_SHM_SIZE:-1gb}
    # Loopback-only host networking keeps the Agent Socket bound to 127.0.0.1:<port>
    # on the EC2 host (never exposed to 0.0.0.0) while working seamlessly with
    # `troy-advanced ec2 tunnel` and local SSH/MCP clients.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      TROY_CHROME_BIN: /usr/bin/chromium
      TROY_ADVANCED_ENDPOINT_FILE: /data/agent-endpoint.json
      XDG_CONFIG_HOME: /data/config
      TZ: ${TZ:-UTC}
    command:
      - daemon
      - run
      - --engine
      - ${TROY_ENGINE:-auto}
      - --port
      - ${TROY_AGENT_PORT:-9333}
      - --profile
      - /data/profile
      - --endpoint
      - /data/agent-endpoint.json
      - --compat-troy
      - --block-private-net
      - --policy
      - ${TROY_POLICY:-standard}
    volumes:
      # Persistent profile volume storing Chromium/Lite profile, cookies,
      # SQLite page memory, audit logs, downloads quarantine, and agent-endpoint.json.
      - troy_profile_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://127.0.0.1:${TROY_AGENT_PORT:-9333}/readyz" >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  troy_profile_data:
    driver: local
